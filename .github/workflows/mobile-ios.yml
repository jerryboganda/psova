name: iOS mobile build

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'package*.json', '.github/workflows/mobile-ios.yml']
  push:
    branches: [main, 'feature/**']
    paths: ['apps/mobile/**', 'packages/**', 'package*.json', '.github/workflows/mobile-ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/mobile/src-tauri }
      - run: sudo gem install cocoapods --no-document
      - run: npm ci
      - run: npm run mobile:build
      - name: Write optional Firebase iOS configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        if: env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != ''
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > apps/mobile/src-tauri/GoogleService-Info.plist
      - name: Initialize iOS project
        env: { CI: 'true' }
        run: npm run tauri -w @psova/mobile -- ios init --ci
      - name: Build iOS simulator app
        env: { CI: 'true' }
        run: npm run tauri -w @psova/mobile -- ios build --debug --target aarch64-sim --ci
      - name: Upload simulator app and generated native project
        uses: actions/upload-artifact@v4
        with:
          name: psova-ios-simulator-${{ github.sha }}
          path: |
            apps/mobile/src-tauri/gen/apple/build/**/*.app
            apps/mobile/src-tauri/gen/apple/
          if-no-files-found: error
          retention-days: 14
