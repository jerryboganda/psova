name: Android mobile build

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'package*.json', '.github/workflows/mobile-android.yml']
  push:
    branches: [main, 'feature/**']
    paths: ['apps/mobile/**', 'packages/**', 'package*.json', '.github/workflows/mobile-android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  ANDROID_API: '36'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Use the Android SDK preinstalled on the runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Install Android API and NDK
        run: yes | sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/mobile/src-tauri }
      - run: npm ci
      - run: npm run mobile:build
      - name: Write optional Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          mkdir -p apps/mobile/src-tauri
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/mobile/src-tauri/google-services.json
      - name: Initialize Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          CI: 'true'
        run: npm run tauri -w @psova/mobile -- android init --ci
      - name: Build debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          CI: 'true'
        run: npm run tauri -w @psova/mobile -- android build --debug --apk --target aarch64
      - name: Upload APK and generated native project
        uses: actions/upload-artifact@v4
        with:
          name: psova-android-debug-${{ github.sha }}
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/mobile/src-tauri/gen/android/
          if-no-files-found: error
          retention-days: 14
