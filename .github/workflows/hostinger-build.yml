name: hostinger-build
# Manual: builds the Linux standalone artifact that scripts/hostinger-deploy.sh uploads.
# Run: gh workflow run hostinger-build --ref main   (see docs/DEPLOY-HOSTINGER-MANUAL.md)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DOCKER_BUILD: '1' # makes next.config.mjs emit output: 'standalone', same as Hostinger's pipeline
      - name: Build the mobile app as a web app (served at /app/)
        run: npm run mobile:build
        env:
          VITE_BASE: /app/
      - run: |
          mkdir out
          cp -r .next/standalone/.next out/.next
          cp -r .next/static out/.next/static
          cp -r public out/public
          cp -r apps/mobile/dist out/public/app
          tar -czf hostinger-build.tgz -C out .
          # Runtime packages (next, react, sharp, ...) traced by the standalone build; only needed when dependencies change.
          tar -czf hostinger-node_modules.tgz -C .next/standalone node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-build
          path: |
            hostinger-build.tgz
            hostinger-node_modules.tgz
          retention-days: 3
