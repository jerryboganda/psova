[package]
name = "psova-mobile"
version = "0.2.0"
description = "PSOVA mobile application"
authors = ["Pakistan Society Of Vascular Anomaly"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "psova_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-biometric = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-haptics = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-psova-push = { path = "../plugins/tauri-plugin-psova-push" }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
